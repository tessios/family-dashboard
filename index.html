<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFE3EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리 가족 기록장">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>우리 가족 기록장</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="icon" href="assets/icon-192.png">
<style>
  :root{
    --cream:#FFF8F1; --ink:#3E3A46; --sub:#8B8494; --line:#F0E7E2;
    --pink:#FFB7C5; --peach:#FFD3B6; --mint:#B8E6D9; --sky:#BBDDF7; --lemon:#FFE9A8; --lav:#D9CCF2;
    --dad:#8FD3C7; --mom:#FFB3A7; --seojin:#9CC8F5; --ria:#FFD86B;
    --card:#FFFFFF; --shadow:0 8px 24px rgba(126,104,112,.09);
    --r:22px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif;
    color:var(--ink); background:var(--cream); line-height:1.45;
    background-image:
      radial-gradient(circle at 8% 4%, #FFE9F0 0, transparent 38%),
      radial-gradient(circle at 96% 12%, #E7F7F1 0, transparent 40%),
      radial-gradient(circle at 50% 100%, #FFF3D9 0, transparent 45%);
    background-attachment:fixed; min-height:100vh;
  }
  button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
  input,textarea{font-family:inherit;color:inherit}
  img{display:block}
  .app{max-width:480px;margin:0 auto;padding:14px 14px 108px;position:relative}
  .hidden{display:none !important}
  .muted{color:var(--sub)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  /* ---------- header ---------- */
  header.top{padding:6px 2px 2px}
  .brand{display:flex;align-items:center;gap:9px}
  .brand .logo{width:38px;height:38px;border-radius:13px;overflow:hidden;box-shadow:0 4px 10px rgba(255,160,180,.25);flex:none}
  .brand .logo img{width:100%;height:100%;object-fit:cover}
  .brand h1{font-size:19px;margin:0;letter-spacing:-.4px;font-weight:800}
  .brand .date{font-size:11.5px;color:var(--sub);margin-top:1px}
  .brand .sync-dot{margin-left:auto;font-size:11px;background:#fff;border:1px solid var(--line);padding:4px 9px;border-radius:999px;color:var(--sub);white-space:nowrap}
  .brand .sync-dot.on{color:#2E7D6B;border-color:#BFE8DC;background:#F0FBF7}

  .users{display:flex;gap:7px;margin:13px 0 12px;overflow-x:auto;padding:2px 1px 4px;scrollbar-width:none}
  .users::-webkit-scrollbar{display:none}
  .uchip{display:flex;align-items:center;gap:7px;padding:5px 11px 5px 5px;border-radius:999px;background:#fff;border:1.5px solid transparent;box-shadow:0 3px 10px rgba(126,104,112,.07);flex:none;transition:.18s}
  .uchip img{width:32px;height:32px;border-radius:50%;object-fit:cover;background:#eee}
  .uchip b{font-size:13px;font-weight:700}
  .uchip .role{font-size:10px;color:var(--sub);display:block;line-height:1.1;margin-top:1px}
  .uchip.active{border-color:var(--ink);transform:translateY(-1px)}
  .uchip[data-who="dad"].active{border-color:var(--dad)}
  .uchip[data-who="mom"].active{border-color:var(--mom)}
  .uchip[data-who="seojin"].active{border-color:var(--seojin)}
  .uchip[data-who="ria"].active{border-color:var(--ria)}

  /* ---------- cards ---------- */
  .card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px;position:relative;overflow:hidden}
  .card-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .card-h h2{font-size:14.5px;margin:0;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:6px}
  .card-h .right{margin-left:auto;font-size:11.5px;color:var(--sub);font-weight:600}
  .pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:14px;padding:11px 14px;font-size:13.5px;font-weight:700;transition:transform .12s,filter .12s;min-height:44px}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--ink);color:#fff;box-shadow:0 6px 14px rgba(62,58,70,.18)}
  .btn.soft{background:#F6F1EE;color:var(--ink)}
  .btn.ghost{background:#fff;border:1.5px solid var(--line)}
  .btn.warm{background:linear-gradient(135deg,#FFC2CE,#FFD9B8);color:#6B3B45}
  .btn:disabled{opacity:.45}
  .row{display:flex;align-items:center;gap:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px}

  /* ---------- weather ---------- */
  .weather{background:linear-gradient(135deg,#E8F6FF 0%,#F2FBF7 55%,#FFF6E6 100%);border:1px solid #fff}
  .weather-main{display:flex;align-items:center;gap:12px}
  .weather .wx-emoji{font-size:38px;line-height:1;filter:drop-shadow(0 3px 5px rgba(120,150,170,.18))}
  .weather .temp{font-size:28px;font-weight:800;letter-spacing:-1px;line-height:1}
  .weather .temp small{font-size:12px;font-weight:600;color:var(--sub);margin-left:5px;letter-spacing:0}
  .weather .desc{font-size:12px;color:#5E6B76;margin-top:4px}
  .weather .side{margin-left:auto;text-align:right;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
  .pm{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:#fff}
  .pm.good{color:#2E7D6B}.pm.ok{color:#4B6FA8}.pm.bad{color:#C25B2C;background:#FFF1E7}.pm.worst{color:#B03535;background:#FFE9E9}
  .wx-upd{font-size:9.5px;color:#8A97A3;margin-top:2px}

  /* ---------- dad status ---------- */
  .status{background:linear-gradient(120deg,#F0FBF8,#FFFFFF 65%)}
  .status .who{font-size:11px;color:var(--sub);font-weight:700}
  .status .badge{display:flex;align-items:center;gap:8px;margin-top:3px}
  .status .badge .e{font-size:24px}
  .status .badge b{font-size:17px;letter-spacing:-.3px}
  .status .badge .sub{font-size:11px;color:var(--sub);font-weight:500;display:block}
  .status-chips{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:12px}
  .status-chips button{font-size:11px;font-weight:700;padding:7px 2px;border-radius:11px;background:#fff;border:1.5px solid #EAF2EF;color:#5C6B66;line-height:1.2}
  .status-chips button .e{display:block;font-size:15px;margin-bottom:1px}
  .status-chips button.on{background:#DFF6EF;border-color:#9FDCCB;color:#1F6B58}

  /* ---------- schedule ---------- */
  .ev{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px dashed #F1EAE5;font-size:13px}
  .ev:last-child{border-bottom:0}
  .ev .t{font-variant-numeric:tabular-nums;font-weight:800;font-size:12.5px;color:#6B6472;width:44px;flex:none}
  .ev .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .ev .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ev .del{font-size:15px;color:#C9C1BE;padding:2px 5px}
  .mini-add{font-size:11.5px;font-weight:700;color:#8A7C72;background:#FBF6F2;border-radius:999px;padding:6px 10px}

  /* ---------- tasks ---------- */
  .task{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid #F7F1ED}
  .task:last-child{border-bottom:0;padding-bottom:3px}
  .check{width:31px;height:31px;border-radius:50%;border:2px solid #E4DAD5;background:#fff;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;transition:.18s}
  .check.done{background:#7BCBB4;border-color:#7BCBB4;animation:pop .3s ease}
  .task.done .t-title{color:#A9A1A8;text-decoration:line-through}
  .task .t-title{font-size:14px;font-weight:600;letter-spacing:-.2px;flex:1;min-width:0}
  .task .t-sub{font-size:10.5px;color:var(--sub);font-weight:500;margin-top:1px}
  .reward{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;white-space:nowrap}
  .reward.money{background:#FFF3D6;color:#A9761B}
  .reward.star{background:#FFF0F4;color:#C25B84}
  .reward.none{background:#F5F1EE;color:#9C938D}
  .prog{height:7px;border-radius:99px;background:#F3ECE8;overflow:hidden;margin-top:10px}
  .prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#FFB7C5,#FFD8B0);transition:width .35s}
  .prog.mint i{background:linear-gradient(90deg,#9FE0CE,#B8E6D9)}
  .allbadge{margin-top:11px;background:#F0FBF7;color:#2C7A67;font-size:11.5px;font-weight:700;border-radius:12px;padding:8px 10px;text-align:center}

  /* ---------- mission ---------- */
  .mission{background:linear-gradient(140deg,#F3ECFF 0%,#FFF6E4 100%);border:1px solid #fff}
  .mission .m-emoji{font-size:34px;line-height:1}
  .mission .m-text{font-size:17px;font-weight:800;letter-spacing:-.4px;margin:8px 0 2px;line-height:1.32}
  .mission .m-sub{font-size:11.5px;color:#8E7F8C}
  .mission .done-stamp{position:absolute;right:14px;top:14px;width:56px;height:56px;border-radius:50%;border:2px dashed #D9A24B;color:#B7802E;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;transform:rotate(-12deg);background:rgba(255,255,255,.55);text-align:center;line-height:1.15}
  .mission-actions{display:grid;grid-template-columns:1.35fr 1fr;gap:8px;margin-top:13px}

  /* ---------- stamps ---------- */
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
  .wcell{background:#FCF8F5;border-radius:13px;padding:6px 2px 5px;border:1.5px solid transparent}
  .wcell.today{border-color:#FFC9D4;background:#FFF6F8}
  .wcell .dow{font-size:9.5px;color:var(--sub);font-weight:700}
  .wcell .slot{height:17px;font-size:12px;line-height:17px}
  .wcell .dnum{font-size:9px;color:#B3AAA6;font-weight:600}
  .streak{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:#B4692A;background:#FFF4E4;padding:5px 10px;border-radius:999px}
  .stamp-legend{display:flex;gap:10px;font-size:10.5px;color:var(--sub);margin-top:10px;flex-wrap:wrap}

  /* ---------- family tiles ---------- */
  .fam-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .fam-tile{display:flex;align-items:center;gap:8px;padding:9px;border-radius:15px;background:#FCF9F7;border:1.5px solid transparent;text-align:left;min-height:56px}
  .fam-tile.active{border-color:#EADFD8;background:#fff;box-shadow:0 3px 9px rgba(126,104,112,.07)}
  .fam-tile img{width:33px;height:33px;border-radius:50%;object-fit:cover;flex:none}
  .fam-tile .nm{font-size:12.5px;font-weight:800;line-height:1.2}
  .fam-tile .st{font-size:10px;color:var(--sub);font-weight:600}
  .fam-tile .bar{height:4px;border-radius:9px;background:#F0E9E5;margin-top:4px;overflow:hidden}
  .fam-tile .bar i{display:block;height:100%;border-radius:9px;background:#7BCBB4}

  /* ---------- wallet ---------- */
  .wallet{background:linear-gradient(135deg,#FFF6DA,#FFF1F3)}
  .wallet .amt{font-size:31px;font-weight:900;letter-spacing:-1.4px;line-height:1.05}
  .wallet .amt small{font-size:13px;font-weight:700;color:#8C7A62;letter-spacing:0;margin-left:3px}
  .wallet .lab{font-size:11px;font-weight:700;color:#8C7A62;margin-bottom:2px}
  .log{font-size:11px;color:#7C7267;display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #F1E6D2}
  .log:last-child{border-bottom:0}
  .log b{font-weight:800}
  .stars{font-size:21px;letter-spacing:2px;line-height:1.2}

  /* ---------- chat ---------- */
  .chat-head{display:flex;align-items:center;gap:8px;margin:2px 2px 10px}
  .chat-head h2{font-size:16px;margin:0;font-weight:800}
  .chat-head .members{display:flex;margin-left:auto}
  .chat-head .members img{width:24px;height:24px;border-radius:50%;border:2px solid #fff;margin-left:-7px;object-fit:cover}
  .chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 200px);height:calc(100dvh - 200px);min-height:380px}
  .chat-scroll{flex:1;overflow-y:auto;padding:4px 2px 8px;scroll-behavior:smooth}
  .msg{display:flex;gap:8px;margin-bottom:11px;align-items:flex-end}
  .msg img.av{width:32px;height:32px;border-radius:50%;object-fit:cover;flex:none;background:#eee}
  .msg .body{max-width:74%}
  .msg .nm{font-size:10px;color:var(--sub);font-weight:700;margin:0 0 3px 3px}
  .bubble{background:#fff;border-radius:16px 16px 16px 5px;padding:9px 12px;font-size:13.5px;box-shadow:0 3px 10px rgba(126,104,112,.07);word-break:break-word;white-space:pre-wrap}
  .msg.me{flex-direction:row-reverse}
  .msg.me .bubble{background:#3E3A46;color:#fff;border-radius:16px 16px 5px 16px}
  .msg.me .nm{text-align:right;margin-right:3px}
  .msg .time{font-size:9px;color:#B8AFB4;margin:3px 4px 0;text-align:right}
  .msg.me .time{text-align:right}
  .msg.me .bubble.sticker{background:#fff;color:var(--ink)}
  .bubble.sticker{background:#fff;padding:7px 12px;box-shadow:0 3px 10px rgba(126,104,112,.07)}
  .bubble.sticker .em{font-size:44px;line-height:1.1;display:block;text-align:center}
  .bubble.sticker .lb{font-size:10px;font-weight:700;color:#8E8A94;display:block;text-align:center;margin-top:1px}
  .bubble.voice{background:#fff;padding:8px}
  .bubble audio{width:200px;max-width:56vw;height:34px}
  .sys{align-self:center;text-align:center;font-size:11px;color:#9A9298;background:#FBF6F3;border-radius:999px;padding:6px 13px;margin:6px auto 14px;max-width:90%}
  .composer{display:flex;gap:7px;align-items:center;background:#fff;border-radius:20px;padding:7px;box-shadow:0 6px 18px rgba(126,104,112,.1);margin-top:8px;position:relative}
  .composer input{flex:1;border:0;outline:0;background:#F8F4F1;border-radius:14px;padding:11px 13px;font-size:14px;min-width:0}
  .icon-btn{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:19px;background:#F8F4F1;flex:none}
  .icon-btn.send{background:var(--ink);color:#fff}
  .icon-btn.rec.on{background:#FF6B81;color:#fff;animation:pulse 1.1s infinite}
  .sticker-panel{position:absolute;left:0;right:0;bottom:62px;background:#fff;border-radius:20px;padding:10px;box-shadow:0 12px 30px rgba(80,60,70,.2);display:grid;grid-template-columns:repeat(3,1fr);gap:6px;z-index:20}
  .sticker-panel button{background:#FCF7F4;border-radius:14px;padding:8px 2px;text-align:center}
  .sticker-panel .em{font-size:30px;display:block;line-height:1.15}
  .sticker-panel .lb{font-size:9.5px;font-weight:700;color:#8E8A94}
  .recbar{display:flex;align-items:center;gap:7px;background:#FFF0F3;border-radius:14px;padding:8px 11px;font-size:12px;font-weight:700;color:#C0455F;margin-top:6px}
  .recbar .rled{width:8px;height:8px;border-radius:50%;background:#FF5A75;animation:pulse 1s infinite}
  .chat-note{font-size:9.5px;color:#AFA6AA;margin:7px 2px 0;line-height:1.4}

  /* ---------- study ---------- */
  .timer-card{text-align:center;background:linear-gradient(150deg,#EEF7FF,#FFF7F0);border:1px solid #fff}
  .modes{display:inline-flex;background:#fff;border-radius:999px;padding:3px;gap:2px;box-shadow:0 3px 8px rgba(126,104,112,.06);margin-bottom:12px}
  .modes button{font-size:11.5px;font-weight:800;padding:7px 12px;border-radius:999px;color:#8E8894}
  .modes button.on{background:#3E3A46;color:#fff}
  .ring-wrap{position:relative;width:190px;height:190px;margin:2px auto 6px}
  .ring{width:100%;height:100%;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:11;stroke-linecap:round}
  .ring .bg{stroke:#EDE6E2}
  .ring .fg{stroke:url(#grad);transition:stroke-dashoffset .3s linear}
  .timer-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  #timerDisplay{font-size:40px;font-weight:900;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;line-height:1}
  #timerLabel{font-size:11px;color:var(--sub);font-weight:700;margin-top:5px}
  .timer-actions{display:flex;gap:8px;justify-content:center;margin-top:8px}
  .timer-actions .btn{min-width:92px}
  .study-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
  .stat{background:#fff;border-radius:15px;padding:10px;text-align:center}
  .stat b{font-size:19px;font-weight:900;display:block;letter-spacing:-.5px}
  .stat span{font-size:10.5px;color:var(--sub);font-weight:700}
  .alarm{background:linear-gradient(135deg,#F4F0FF,#FFF7F7)}
  .time-input{border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;font-size:14px;font-weight:700;background:#fff;outline:0}
  .switch{position:relative;width:46px;height:27px;flex:none}
  .switch input{opacity:0;width:0;height:0;position:absolute}
  .switch i{position:absolute;inset:0;border-radius:999px;background:#E7DFDB;transition:.2s}
  .switch i:after{content:"";position:absolute;width:21px;height:21px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.15)}
  .switch input:checked + i{background:#7BCBB4}
  .switch input:checked + i:after{transform:translateX(19px)}
  .set-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #F7F1ED;font-size:13px}
  .set-row:last-child{border-bottom:0}
  .set-row .lab{flex:1;min-width:0}
  .set-row .lab b{display:block;font-size:13px}
  .set-row .lab span{font-size:10.5px;color:var(--sub)}

  /* ---------- tabbar ---------- */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:0 10px calc(8px + env(safe-area-inset-bottom)) 10px;pointer-events:none}
  .tabbar-inner{max-width:452px;margin:0 auto;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:22px;display:grid;grid-template-columns:repeat(5,1fr);padding:6px;box-shadow:0 10px 28px rgba(100,80,90,.16);pointer-events:auto;border:1px solid rgba(255,255,255,.9)}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 5px;border-radius:15px;color:#A49CA2;font-size:9.5px;font-weight:700;min-height:46px}
  .tabbar button .e{font-size:19px;line-height:1.1;filter:grayscale(.55);transition:.15s}
  .tabbar button.on{color:#3E3A46;background:#FBF2EC}
  .tabbar button.on .e{filter:none;transform:translateY(-1px)}
  .tabbar .badge{position:absolute;transform:translate(13px,-2px);background:#FF8FA3;color:#fff;font-size:8px;padding:1px 4px;border-radius:9px;font-weight:800}

  /* ---------- fx ---------- */
  #fx{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
  .float{position:fixed;font-size:24px;font-weight:900;animation:floatUp 1.15s cubic-bezier(.2,.7,.4,1) forwards;will-change:transform,opacity;z-index:82;filter:drop-shadow(0 3px 6px rgba(0,0,0,.14))}
  .earn{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);background:#fff;border-radius:999px;padding:12px 22px;font-size:20px;font-weight:900;box-shadow:0 12px 34px rgba(80,60,70,.24);animation:earnBurst 1.5s ease forwards;z-index:82;white-space:nowrap}
  .earn small{font-size:11px;color:var(--sub);display:block;text-align:center;font-weight:700;letter-spacing:0}
  .confetti{position:fixed;width:8px;height:13px;border-radius:2px;animation:fall 2.6s linear forwards;z-index:81}
  .toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:rgba(62,58,70,.94);color:#fff;font-size:12.5px;font-weight:700;padding:10px 16px;border-radius:14px;z-index:90;animation:toastIn .25s ease;max-width:86vw;text-align:center;box-shadow:0 8px 22px rgba(0,0,0,.2)}

  #banners{position:fixed;top:8px;left:0;right:0;z-index:95;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 10px;pointer-events:none}
  .banner{width:100%;max-width:452px;background:#fff;border-radius:17px;box-shadow:0 10px 28px rgba(80,60,70,.2);padding:11px 12px;display:flex;gap:10px;align-items:flex-start;animation:slideDown .3s ease;pointer-events:auto;border-left:5px solid #FFB7C5}

  function chime(kind){
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      if(!chime.ctx) chime.ctx = new AC();
      var ctx = chime.ctx;
      if(ctx.state === 'suspended'){ try{ ctx.resume().catch(function(){}); }catch(e2){} }
      var notes = kind === 'alarm' ? [660, 880, 660, 880] : [523.25, 659.25, 783.99, 1046.5];
      var t0 = ctx.currentTime + 0.02;
      notes.forEach(function(f, i){
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0, t0 + i*0.16);
        g.gain.linearRampToValueAtTime(0.18, t0 + i*0.16 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, t0 + i*0.16 + 0.38);
        o.connect(g); g.connect(ctx.destination);
        o.start(t0 + i*0.16); o.stop(t0 + i*0.16 + 0.42);
      });
    }catch(e){ /* 소리 없이도 배너는 뜬다 */ }
  }

  function dayState(k){
    var d = state.days[k];
    if(!d) return null;
    var mission = !!(d.mission && d.mission.done);
    var tasks = ORDER.some(function(w){
      var list = d.tasks && d.tasks[w];
      return list && list.length && list.every(function(t){ return t.done; });
    });
    return {mission:mission, tasks:tasks};
  }
  function stampCount(k){
    var s = dayState(k);
    if(!s) return 0;
    return (s.mission?1:0) + (s.tasks?1:0);
  }
  function weekStamps(){
    var mon = startOfWeek(new Date());
    return Array.from({length:7}, function(_, i){
      var d = addDays(mon, i), k = ymd(d), s = state.days[k];
      var m = !!(s && s.mission && s.mission.done);
      var a = false;
      if(s && s.tasks){
        a = ORDER.some(function(w){ var l = s.tasks[w]; return l && l.length && l.every(function(t){ return t.done; }); });
      }
      return {date:d, k:k, mission:m, tasks:a, today:k===todayKey()};
    });
  }
  function currentStreak(){
    var d = new Date();
    var todayActive = stampCount(ymd(d)) > 0;
    if(!todayActive) d = addDays(d, -1);
    var n = 0;
    while(n < 400 && stampCount(ymd(d)) > 0){
      n++; d = addDays(d, -1);
    }
    return n;
  }
  function weekStampTotal(){
    return weekStamps().reduce(function(s, x){ return s + (x.mission?1:0) + (x.tasks?1:0); }, 0);
  }

  function wdesc(code){
    if(code === 0) return ['☀️','맑음'];
    if(code <= 2) return ['🌤','대체로 맑음'];
    if(code === 3) return ['☁️','흐림'];
    if(code === 45 || code === 48) return ['🌫','안개'];
    if(code >= 51 && code <= 57) return ['🌦','이슬비'];
    if(code >= 61 && code <= 67) return ['🌧','비'];
    if(code >= 71 && code <= 77) return ['🌨','눈'];
    if(code >= 80 && code <= 82) return ['🌦','소나기'];
    if(code >= 85 && code <= 86) return ['🌨','눈 소나기'];
    if(code >= 95) return ['⛈','천둥·비'];
    return ['☁️','흐림'];
  }
  function pmGrade(v){
    if(v <= 15) return ['좋음','good'];

    if(v <= 75) return ['나쁨','bad'];
    return ['매우 나쁨','worst'];
  }

  async function loadWeather(){
    try{
      var ac = new AbortController();
      var to = setTimeout(function(){ ac.abort(); }, 6500);
      var base = 'https://api.open-meteo.com/v1/forecast?latitude=37.3923&longitude=126.6344&current=temperature_2m,apparent_temperature,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FSeoul&forecast_days=1';
      var aq = 'https://air-quality-api.open-meteo.com/v1/air-quality?latitude=37.3923&longitude=126.6344&current=pm2_5,pm10&timezone=Asia%2FSeoul';
      var res = await fetch(base, {signal:ac.signal, cache:'no-store'});
      if(!res.ok) throw new Error('weather ' + res.status);
      var j = await res.json();
      clearTimeout(to);
      var ac2 = new AbortController();
      var to2 = setTimeout(function(){ ac2.abort(); }, 6500);
      var res2 = await fetch(aq, {signal:ac2.signal, cache:'no-store'});
      var j2 = res2.ok ? await res2.json() : null;
      clearTimeout(to2);
      weather.temp = j.current.temperature_2m;
      weather.feels = j.current.apparent_temperature;
      weather.code = j.current.weather_code;
      weather.max = j.daily.temperature_2m_max[0];
      weather.min = j.daily.temperature_2m_min[0];
      if(j2 && j2.current){ weather.pm25 = j2.current.pm2_5; weather.pm10 = j2.current.pm10; }
      weather.live = true;
      var now = new Date(); weather.at = hhmm(now);
      renderWeather();
    }catch(e){
      weather.live = false;
      renderWeather();
    }
  }

  async function toggleRecord(){
    if(recording && recording.active){ stopRecording(); return; }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){
      toast('이 브라우저는 녹음을 지원하지 않아요. 문자나 스티커를 보내 주세요.');
      return;
    }
    try{
      var stream = await navigator.mediaDevices.getUserMedia({audio:true});
      var mime = '';
      if(MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) mime = 'audio/webm;codecs=opus';
      else if(MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('audio/mp4')) mime = 'audio/mp4';
      var mr = mime ? new MediaRecorder(stream, {mimeType:mime}) : new MediaRecorder(stream);
      var chunks = [];
      var started = Date.now();
      recording = {active:true, mr:mr, stream:stream, chunks:chunks};
      mr.ondataavailable = function(e){ if(e.data && e.data.size) chunks.push(e.data); };
      mr.onstop = function(){
        var secs = Math.max(1, Math.round((Date.now()-started)/1000));
        var blob = new Blob(chunks, {type: mr.mimeType || 'audio/webm'});
        stream.getTracks().forEach(function(t){ t.stop(); });
        recording = null;
        $('#recBtn').classList.remove('on');
        $('#recBar').classList.add('hidden');
        clearInterval(recTimer);
        if(blob.size < 400){ toast('녹음이 너무 짧아요. 다시 해볼까요?'); return; }
        if(blob.size > 1200000){ toast('녹음이 너무 길어요. 30초 안으로 다시 해주세요.'); return; }
        var fr = new FileReader();
        fr.onload = function(){
          addMsg({who:state.currentUser, kind:'voice', audio:fr.result, dur:Math.floor(secs/60) + ':' + pad(secs%60)});
          chime('done');
        };
        fr.readAsDataURL(blob);
      };
      mr.start();
      $('#recBtn').classList.add('on');
      $('#recBar').classList.remove('hidden');
      $('#recTime').textContent = '0:00';
      recTimer = setInterval(function(){
        var secs = Math.round((Date.now()-started)/1000);
        $('#recTime').textContent = Math.floor(secs/60) + ':' + pad(secs%60);
        if(secs >= 30) stopRecording();
      }, 300);
      chime('done');
    }catch(e){
      recording = null;
      toast('마이크 권한이 필요해요. 브라우저 설정에서 마이크를 허용해 주세요.');
    }
  }

  function stopRecording(){
    try{
      if(recording && recording.mr && recording.mr.state !== 'inactive') recording.mr.stop();
    }catch(e){ recording = null; $('#recBtn').classList.remove('on'); $('#recBar').classList.add('hidden'); }
  }

  function renderTimer(){
    var total = timer.mode === 'free' ? 3600 : timer.mode*60;
    var secs = timer.mode === 'free' ? timer.elapsed : timer.remain;
    var m = Math.floor(secs/60), s = secs%60;
    var disp = $('#timerDisplay'); if(!disp) return;
    disp.textContent = pad(m) + ':' + pad(s);
    var C = 2*Math.PI*68;
    var prog = timer.mode === 'free' ? Math.min(1, timer.elapsed/3600) : (total ? timer.remain/total : 0);
    var ring = $('#ringFg');
    if(ring) ring.setAttribute('stroke-dashoffset', String(C*(1-prog)));
    var lbl = $('#timerLabel');
    if(lbl) lbl.textContent = timer.mode === 'free' ? (timer.running?'자유 타이머 진행 중':'자유 타이머') : (timer.running?'집중하는 중…':'집중 시간');
    var btn = $('#timerToggle');
    if(btn) btn.textContent = timer.running ? '일시정지' : (timer.remain < timer.mode*60 && timer.mode !== 'free' ? '계속하기' : '시작');
  }

  function startPauseTimer(){
    if(timer.mode === 'free'){
      if(timer.running){ timer.elapsed += Math.round((Date.now()-timer.startedAt)/1000); timer.running = false; }
      else { timer.running = true; timer.startedAt = Date.now(); chime('done'); }
      renderTimer(); return;
    }
    if(timer.running){
      timer.remain = Math.max(0, Math.round((timer.endAt - Date.now())/1000));
      timer.running = false; renderTimer();
    } else {
      if(timer.remain <= 0) timer.remain = timer.mode*60;
      timer.running = true;
      timer.endAt = Date.now() + timer.remain*1000;
      timer.startedAt = Date.now();
      chime('done'); renderTimer();
    }
  }

  function resetTimer(){
    timer.running = false; timer.elapsed = 0;
    timer.remain = timer.mode === 'free' ? 0 : timer.mode*60;
    renderTimer();
  }

    timer.mode = m === 'free' ? 'free' : Number(m);

  function syncConfigured(){ return !!(state.sync && state.sync.url && state.sync.key); }
  function syncBase(){ return String(state.sync.url||'').replace(/\/+$/,''); }

  async function sbFetch(path, opts){
    opts = opts || {};
    var headers = Object.assign({
      'apikey': state.sync.key,
      'Authorization': 'Bearer ' + state.sync.key,
      'Content-Type': 'application/json'
    }, opts.headers || {});
    var res = await fetch(syncBase() + '/rest/v1/' + path, Object.assign({}, opts, {headers:headers}));
    if(!res.ok){
      var body = '';
      try{ body = await res.text(); }catch(e){}
      var err = new Error('HTTP ' + res.status + ' ' + body.slice(0,160));
      err.status = res.status;
      throw err;
    }
    return res;
  }

  async function pullRemote(manual){
    if(!syncConfigured() || syncing) return false;
    syncing = true;
    try{
      var res = await sbFetch('family_state?id=eq.family&select=data,updated_at');
      var rows = await res.json();
      if(Array.isArray(rows) && rows.length){
        var row = rows[0];
        var remoteAt = new Date(row.updated_at).getTime();
        if(remoteAt > (state.sync.lastSync || 0)){
          var incoming = row.data;
          if(incoming && incoming.version === 1){
            var keep = {url:state.sync.url, key:state.sync.key, lastSync:remoteAt};
            var next = Object.assign(defaultState(), incoming);
            next.sync = keep;
            next.currentUser = state.currentUser;
            state = next;
            ensureDay(todayKey());
            saveLocal(); renderAll();
            if(manual) toast('가족 기록을 불러왔어요 ☁️');
          }
        } else if(manual){
          toast('이미 최신 상태예요');
        }
        updateSyncUI('연결됨 · ' + fmtClock(remoteAt), true);
      } else {
        await pushRemote(true);
        updateSyncUI('새 기록을 올렸어요', true);
      }
      return true;
    }catch(e){
      updateSyncUI('동기화 확인 실패 (오프라인일 수 있어요)', false);
      return false;
    }finally{ syncing = false; }
  }

  function pushRemote(now){
    if(!syncConfigured()) return;
    if(pushTimer) clearTimeout(pushTimer);
    pushTimer = setTimeout(doPush, now ? 0 : 1600);
  }

  async function doPush(){
    if(!syncConfigured() || pushing) return;
    pushing = true;
    try{
      var payload = JSON.parse(JSON.stringify(state));
      payload.sync = {url:'', key:'', lastSync:0};
      var stamp = new Date().toISOString();
      await sbFetch('family_state?on_conflict=id', {
        method:'POST',
        headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},
        body: JSON.stringify({id:'family', data:payload, updated_at:stamp})
      });
      state.sync.lastSync = new Date(stamp).getTime();
      saveLocal();
      updateSyncUI('연결됨 · ' + fmtClock(Date.now()), true);
    }catch(e){
      updateSyncUI('저장 실패 · 다음에 다시 시도할게요', false);
    }finally{ pushing = false; }
  }

  /* ============================================================
     백업 / 초기화
     ============================================================ */
  function exportBackup(){
    var data = JSON.stringify(state, null, 2);
    var blob = new Blob([data], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'family-dashboard-backup-' + todayKey() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
    toast('백업 파일을 내려받았어요 💾');
  }

  function handleImport(file){
    if(!file) return;
    var fr = new FileReader();
    fr.onload = function(){
      try{
        var data = JSON.parse(fr.result);
        if(!data || data.version !== 1 || !data.days) throw new Error('형식');
        var keep = {url:state.sync.url, key:state.sync.key, lastSync:state.sync.lastSync};
        state = Object.assign(defaultState(), data);
        state.sync = keep;
        ensureDay(todayKey());
        save(); renderAll();
        toast('기록을 불러왔어요 (' + Object.keys(state.days).length + '일)');
      }catch(e){ toast('파일을 읽을 수 없어요. 이 앱에서 내보낸 JSON인지 확인해 주세요.'); }
      var input = $('#importFile'); if(input) input.value = '';
    };
    fr.readAsText(file);
  }

  function askReset(){
    openModal('<h3>기록을 초기화할까요?</h3><div class="sub">할 일·용돈·도장·채팅이 이 기기에서 지워져요. 되돌릴 수 없어요.</div>' +
      '<div style="background:#FFF6F0;border-radius:14px;padding:11px;font-size:11px;color:#8B6A50;line-height:1.5">먼저 <b>설정 → 기록 백업 → 내보내기</b>로 파일을 받아 두면 다시 불러올 수 있어요.</div>' +
      '<div class="modal-actions"><button class="btn ghost" data-close="1">취소</button><button class="btn" style="background:#E98787;color:#fff" data-act="reset-do">초기화</button></div>');
  }

  function doReset(){
    var sync = {url:state.sync.url, key:state.sync.key, lastSync:0};
    var user = state.currentUser;
    state = defaultState();
    state.sync = sync; state.currentUser = user;
    ensureDay(todayKey());
    save(); renderAll(); closeModal();
    toast('기록을 초기화했어요');
  }

  function askNotify(){
    if(!('Notification' in window)){ toast('이 브라우저는 휴대폰 알림을 지원하지 않아요. 앱 배너로 알려드릴게요.'); return; }
    Notification.requestPermission().then(function(p){
      state.settings.browserNotify = (p === 'granted');
      save(); renderAll();
      toast(p === 'granted' ? '휴대폰 알림을 허용했어요 🔔' : '알림이 허용되지 않았어요. 앱 안 배너로 알려드릴게요.');
    }).catch(function(){ toast('알림 권한을 요청하지 못했어요.'); });
  }

  /* ============================================================
     알람 체크 / 시계
     ============================================================ */
  function firedOnce(key){
    if(state.fired[key]) return true;
    state.fired[key] = 1;
    save({push:false});
    return false;
  }

  function checkAlarms(){
    var now = new Date();
    var hm = hhmm(now);
    if(hm === lastAlarmMinute) return;
    lastAlarmMinute = hm;
    var day = todayKey();
    var s = state.settings;

    if(s.tabletAlarm && s.tabletOff === hm && !firedOnce(day + '-tablet')){
      chime('alarm');
      banner('🌙','태블릿·폰 끄는 시간이에요','충전기는 거실로 두고, 내일 이야기로 만나요. 잘 자요!', 30000);
    }
    if(s.notifyBatch && s.morning === hm && !firedOnce(day + '-morning')){
      var d = ensureDay(day);
      var total = ORDER.reduce(function(a,w){ return a + d.tasks[w].length; },0);
      banner('☀️','좋은 아침이에요!','오늘 할 일 ' + total + '개와 가족 미션 1개가 기다려요. ' + (weather.live ? Math.round(weather.temp) + '° ' + wdesc(weather.code)[1] : '날씨를 확인해 보세요'), 20000);
    }
    if(s.notifyBatch && s.evening === hm && !firedOnce(day + '-evening')){
      var d2 = ensureDay(day);
      var left = 0;
      ORDER.forEach(function(w){ left += d2.tasks[w].filter(function(t){ return !t.done; }).length; });
      var r = d2.tasks.ria.filter(function(t){ return !t.done; }).length;
      banner('🌆','오늘 하루 어땠어요?', left ? '아직 ' + left + '개 할 일이 남았어요. 리아는 ' + r + '개!' : '오늘 할 일을 모두 끝냈어요. 도장판을 확인해 봐요 🌟', 20000);
    }
  }

  function tick(){
    if(timer.running){
      if(timer.mode === 'free'){
        var secs = timer.elapsed + Math.round((Date.now()-timer.startedAt)/1000);
        var el = $('#timerDisplay');
        if(el){ $('#timerDisplay').textContent = pad(Math.floor(secs/60)) + ':' + pad(secs%60); }
      } else {
        var rem = Math.max(0, Math.round((timer.endAt - Date.now())/1000));
        timer.remain = rem;
        renderTimer();
        if(rem <= 0){
          timer.running = false;
          completeFocus(timer.mode);
          timer.remain = timer.mode*60;
          renderTimer();
        }
      }
    }
    checkAlarms();
  }

  /* ============================================================
     전체 렌더 / 이벤트
     ============================================================ */
  function renderAll(){
    ensureDay(todayKey());
    renderHeader();
    renderWeather();
    renderStatus();
    renderHome();
    renderMissionTab();
    renderChat();
    renderTimerCard();
    renderStudyStats();
    renderAlarmCard();
    renderBatchCard();
    renderSettings();
    updateSyncUI(syncConfigured() ? (state.sync.lastSync ? '연결됨 · ' + fmtClock(state.sync.lastSync) : '연결됨') : '로컬 저장', true);
  }

  function switchTab(tab){
    $$('.view').forEach(function(v){ v.classList.add('hidden'); });
    var v = $('#view-' + tab);
    if(v) v.classList.remove('hidden');
    $$('#tabbar button').forEach(function(b){
      var on = b.dataset.tab === tab;
      b.classList.toggle('on', on);
      if(on) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
    });
    if(tab === 'chat'){ renderChat(); var box = $('#chatScroll'); if(box) box.scrollTop = box.scrollHeight; }
    if(tab === 'study'){ renderTimerCard(); renderStudyStats(); }
    if(tab === 'settings'){ renderSettings(); }
    window.scrollTo(0, 0);
    switchTab.current = tab;
  }

  function handleAction(act, el){
    switch(act){
      case 'user': switchUser(el.dataset.who); break;
      case 'status': setStatus(el.dataset.status); break;
      case 'task': toggleTask(el.dataset.who, el.dataset.id, el); break;
      case 'mission-done': completeMission(); break;
      case 'mission-draw': drawMission(); break;
      case 'claim-ria': claimRia(); break;
      case 'calendar': openCalendar(); break;
      case 'cal-prev': calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth()-1, 1); renderCalendarModal(); break;
      case 'cal-next': calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth()+1, 1); renderCalendarModal(); break;
      case 'cal-today': calCursor = new Date(); renderCalendarModal(); break;
      case 'add-event': openEventModal(); break;
      case 'save-event': saveEvent(); break;
      case 'del-event': deleteEvent(el.dataset.id); break;
      case 'send': sendChat(); break;
      case 'sticker-toggle': if($('#stickerPanel')) closeStickerPanel(); else openStickerPanel(); break;
      case 'sticker': sendSticker(STICKERS[Number(el.dataset.i)]); break;
      case 'record': toggleRecord(); break;
      case 'timer-toggle': startPauseTimer(); break;
      case 'timer-reset': resetTimer(); break;
      case 'tmode': setTimerMode(el.dataset.min); break;
      case 'sync-modal': openSyncModal(); break;
      case 'sync-test': testSync(true); break;
      case 'sync-save': saveSync(); break;
      case 'sync-clear': clearSync(); break;
      case 'export': exportBackup(); break;
      case 'import': $('#importFile').click(); break;
      case 'reset-modal': askReset(); break;
      case 'reset-do': doReset(); break;
      case 'ask-notify': askNotify(); break;
      case 'close-hifive': closeHiFive(); break;
    }
  }

  document.addEventListener('click', function(e){
    var t = e.target;
    if(t.dataset && t.dataset.backdrop){
      closeModal();
      return;
    }
    if(t.closest('[data-close]')){
      closeModal();
      return;
    }
    var tabBtn = t.closest('[data-tab]');
    if(tabBtn){ switchTab(tabBtn.dataset.tab); return; }
    var a = t.closest('[data-act]');
    if(a){ e.preventDefault(); handleAction(a.dataset.act, a); }
  });

  document.addEventListener('change', function(e){
    var t = e.target;
    var s = state.settings;
    if(t.id === 'tabletOff'){ s.tabletOff = t.value || '21:30'; save(); renderAlarmCard(); renderSettings(); toast('알람 시각을 ' + s.tabletOff + '로 바꿨어요'); }
    else if(t.id === 'alarmToggle'){ s.tabletAlarm = t.checked; save(); renderAlarmCard(); renderSettings(); }
    else if(t.id === 'batchToggle' || t.id === 'batchToggle2'){ s.notifyBatch = t.checked; save(); renderBatchCard(); renderAlarmCard(); renderSettings(); renderHeader(); }
    else if(t.id === 'morningTime' || t.id === 'morningTime2'){ s.morning = t.value || '08:00'; save(); renderBatchCard(); renderAlarmCard(); renderSettings(); renderHeader(); }
    else if(t.id === 'eveningTime' || t.id === 'eveningTime2'){ s.evening = t.value || '20:00'; save(); renderBatchCard(); renderAlarmCard(); renderSettings(); renderHeader(); }
    else if(t.id === 'importFile'){ handleImport(t.files && t.files[0]); }
  });

  document.addEventListener('keydown', function(e){
    if(e.target && e.target.id === 'chatInput' && e.key === 'Enter' && !e.isComposing){
      e.preventDefault(); sendChat();
    }
  });

  window.addEventListener('error', function(ev){
    (window.__errors = window.__errors || []).push(String(ev.message || ev.error || 'error'));
  });
  window.addEventListener('unhandledrejection', function(ev){
    (window.__errors = window.__errors || []).push('promise: ' + String(ev.reason && ev.reason.message || ev.reason));
  });

  /* ============================================================
     시작
     ============================================================ */
  loadState();
  renderAll();
  switchTab('home');
  loadWeather();
  setInterval(tick, 500);
  setInterval(function(){ renderHeader(); }, 30000);
  setInterval(function(){ loadWeather(); }, 30*60*1000);
  if(syncConfigured()){
    setTimeout(function(){ pullRemote(false); }, 1200);
    setInterval(function(){ if(document.visibilityState === 'visible') pullRemote(false); }, 20000);
  }
  window.__app = {state:state, getState:function(){ return state; }};
})();
</script>
</body>
</html>
